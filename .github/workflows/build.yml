name: Build

on:
  workflow_dispatch:
  push:
    branches:
      - api13
  pull_request:

jobs:
  build:
    name: Build API 13
    runs-on: windows-2022

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj', '**/*.props') }}
          restore-keys: |
            nuget-${{ runner.os }}-

      - name: Download pinned TC-compatible Dalamud API 13
        shell: pwsh
        run: |
          $hooksPath = Join-Path $env:APPDATA 'XIVLauncher\addon\Hooks\dev'
          New-Item -ItemType Directory -Force -Path $hooksPath | Out-Null
          Invoke-WebRequest -Uri 'https://github.com/ffxiv-tc-port/DalamudPluginsTC/releases/download/dalamud-pin-v13.0.0.16/dalamud-api13-net9.zip' -OutFile dalamud.zip
          Expand-Archive -Path dalamud.zip -DestinationPath $hooksPath -Force

      - name: Restore
        run: dotnet restore ./MouseLock/MouseLock.csproj

      - name: Build Debug
        run: dotnet build ./MouseLock/MouseLock.csproj --configuration Debug --no-restore

      - name: Build Release
        run: dotnet build ./MouseLock/MouseLock.csproj --configuration Release --no-restore

      - name: Upload Release package
        uses: actions/upload-artifact@v4
        with:
          name: MouseLock-API13
          path: ./MouseLock/bin/Release/MouseLock/latest.zip
